# Reference copy of the Cloudflare trusted-proxy configuration.
#
# GENERATE THIS ON YOUR SERVER INSTEAD OF USING THIS FILE AS-IS:
#
#     sudo scripts/cloudflare-remoteip.sh
#
# That fetches Cloudflare's currently published ranges, validates them,
# and writes /etc/apache2/conf-available/cloudflare-remoteip.conf. The
# ranges below are a point-in-time snapshot kept here so you can see the
# shape of the file (and as a fallback if the server can't reach
# cloudflare.com) -- they are NOT authoritative and will go stale.
#
# Stale ranges are not a cosmetic problem. RemoteIPTrustedProxy is an
# allowlist of peers whose CF-Connecting-IP header is believed: if an
# address here stops belonging to Cloudflare, whoever holds it next can
# claim to be any visitor, which defeats both the submission throttle
# and the admin login lockout. Verify against
# https://www.cloudflare.com/ips-v4 and .../ips-v6 before enabling, and
# re-run the script periodically.
#
#     sudo a2enmod remoteip
#     sudo cp scripts/cloudflare-remoteip-example.conf \
#       /etc/apache2/conf-available/cloudflare-remoteip.conf
#     sudo a2enconf cloudflare-remoteip
#     sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Only enable this when the origin really is behind Cloudflare, and
# firewall ports 80/443 to these same ranges. Trusting the header while
# the origin is directly reachable is worse than not setting it at all.

<IfModule mod_remoteip.c>
    # Cloudflare sends the visitor's address here on every proxied
    # request. Only honoured from the trusted peers listed below.
    RemoteIPHeader CF-Connecting-IP

    # Log format that records the restored client address (%a)
    # instead of the connection peer (%h, which would be
    # Cloudflare). Switch a vhost's CustomLog to 'combined_cf' to
    # use it; 'combined' still works and stays available.
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined_cf

    RemoteIPTrustedProxy 173.245.48.0/20
    RemoteIPTrustedProxy 103.21.244.0/22
    RemoteIPTrustedProxy 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22
    RemoteIPTrustedProxy 141.101.64.0/18
    RemoteIPTrustedProxy 108.162.192.0/18
    RemoteIPTrustedProxy 190.93.240.0/20
    RemoteIPTrustedProxy 188.114.96.0/20
    RemoteIPTrustedProxy 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17
    RemoteIPTrustedProxy 162.158.0.0/15
    RemoteIPTrustedProxy 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14
    RemoteIPTrustedProxy 172.64.0.0/13
    RemoteIPTrustedProxy 131.0.72.0/22
    RemoteIPTrustedProxy 2400:cb00::/32
    RemoteIPTrustedProxy 2606:4700::/32
    RemoteIPTrustedProxy 2803:f800::/32
    RemoteIPTrustedProxy 2405:b500::/32
    RemoteIPTrustedProxy 2405:8100::/32
    RemoteIPTrustedProxy 2a06:98c0::/29
    RemoteIPTrustedProxy 2c0f:f248::/32
</IfModule>
