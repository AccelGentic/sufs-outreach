# Example Apache vhost for the University Outreach Tool.
# Copy to /etc/apache2/sites-available/university-outreach.conf,
# edit ServerName, then:
#   sudo a2ensite university-outreach.conf
#   sudo systemctl reload apache2
# Run certbot afterwards to add HTTPS (recommended before going live).

<VirtualHost *:80>
    ServerName outreach.yourdomain.org

    # Only the public/ folder is served. config.php, includes/, vendor/,
    # sql/, and scripts/ stay outside the document root entirely.
    DocumentRoot /var/www/university-outreach/public

    <Directory /var/www/university-outreach/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/outreach-error.log
    CustomLog ${APACHE_LOG_DIR}/outreach-access.log combined
</VirtualHost>
