# Example Apache vhosts for the University Outreach Tool, with HTTPS.
#
# This is the file to use once you have a TLS certificate. The plain
# apache-vhost-example.conf is only meant for getting a host reachable
# before certificates exist -- this form collects names, email addresses
# and postal addresses, and the admin password crosses the wire on every
# sign-in, so nothing here should be served over plain HTTP in the end.
#
# ---------------------------------------------------------------------
# 1. Modules (once per server)
#
#      sudo a2enmod ssl headers rewrite
#
# 2. Get a certificate. Use certonly + webroot rather than the --apache
#    plugin, so certbot issues the certificate without rewriting your
#    vhost files -- the port 80 block below deliberately keeps
#    /.well-known/acme-challenge/ reachable over HTTP so renewals keep
#    working after the redirect is in place:
#
#      sudo certbot certonly --webroot \
#        -w /var/www/university-outreach/public \
#        -d outreach.yourdomain.org
#
#    (If you'd rather let certbot manage the config, use the plain
#    apache-vhost-example.conf with `sudo certbot --apache` instead and
#    ignore this file -- certbot will generate its own -le-ssl.conf.)
#
# 3. Copy this file, replacing outreach.yourdomain.org throughout:
#
#      sudo cp scripts/apache-vhost-ssl-example.conf \
#        /etc/apache2/sites-available/university-outreach.conf
#      sudo sed -i 's/outreach\.yourdomain\.org/YOUR.REAL.HOST/g' \
#        /etc/apache2/sites-available/university-outreach.conf
#      sudo a2ensite university-outreach.conf
#      sudo a2dissite 000-default.conf      # optional: stop serving /var/www/html
#      sudo apache2ctl configtest && sudo systemctl reload apache2
#
# 4. Confirm renewals still work end to end:
#
#      sudo certbot renew --dry-run
# ---------------------------------------------------------------------


# --- Port 80: ACME challenges, everything else redirected to HTTPS ---
<VirtualHost *:80>
    ServerName outreach.yourdomain.org
    # ServerAlias www.outreach.yourdomain.org

    # Needed so the ACME challenge files certbot writes under
    # public/.well-known/ are actually servable.
    DocumentRoot /var/www/university-outreach/public

    <Directory /var/www/university-outreach/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    # Everything except the ACME challenge path goes to HTTPS. Let's
    # Encrypt does follow redirects, but leaving the challenge path on
    # plain HTTP keeps renewal working even if the certificate has
    # already expired -- which is exactly when you need it to.
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=301]

    ErrorLog ${APACHE_LOG_DIR}/outreach-error.log
    CustomLog ${APACHE_LOG_DIR}/outreach-access.log combined
</VirtualHost>


# --- Port 443: the real site ---
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName outreach.yourdomain.org
    # ServerAlias www.outreach.yourdomain.org

    # Only public/ is served. config.php (which holds the database
    # password, the mail credentials and the admin password hash),
    # includes/, vendor/, sql/ and scripts/ all stay outside the
    # document root and are unreachable over HTTP by construction.
    DocumentRoot /var/www/university-outreach/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/outreach.yourdomain.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/outreach.yourdomain.org/privkey.pem

    # Certbot ships a maintained protocol/cipher baseline; preferring it
    # means the TLS settings get updated with the package instead of
    # rotting in this file. Drop the Include and uncomment the block
    # below if that file doesn't exist on your server.
    Include /etc/letsencrypt/options-ssl-apache.conf
    #
    # SSLProtocol             -all +TLSv1.2 +TLSv1.3
    # SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    # SSLHonorCipherOrder     off
    # SSLSessionTickets       off

    # HTTP/2, if mod_http2 is enabled (sudo a2enmod http2).
    # Protocols h2 http/1.1

    <Directory /var/www/university-outreach/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Never serve dotfiles, whatever ends up in the document root --
    # editor backups, a stray .env, a .git directory copied by accident.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>

    # Keeps `always` (unlike the headers below it): nothing in the app
    # sets HSTS, so there's no header to conflict with, and it should be
    # present on Apache's own error responses too.
    # Only ever sent over HTTPS, never on the port 80 vhost above.
    # A year of HSTS is a commitment: browsers that have seen this
    # header will refuse plain HTTP for this hostname until it expires,
    # so confirm the certificate works before enabling it. No
    # includeSubDomains/preload -- add those only if every hostname
    # under this domain is HTTPS-only.
    Header always set Strict-Transport-Security "max-age=31536000"

    # The three below deliberately drop `always` and use setifempty.
    # The admin pages already send their own, stricter values from
    # includes/admin_auth.php (X-Frame-Options: DENY, Referrer-Policy:
    # same-origin, plus nosniff). `always` writes into a different
    # header table than PHP's header() does, so `Header always set`
    # here would not replace those -- it would emit a second, weaker
    # X-Frame-Options alongside the DENY and leave browsers to
    # reconcile two conflicting values. Plain setifempty checks the same
    # table PHP wrote to: the admin pages keep their stricter header,
    # and everything else (visitor pages, static assets) picks up these
    # site-wide defaults.
    Header setifempty X-Content-Type-Options "nosniff"
    Header setifempty X-Frame-Options "SAMEORIGIN"
    Header setifempty Referrer-Policy "strict-origin-when-cross-origin"

    # Optional second lock on the template editor. It already requires
    # the admin password from config.php, with a per-IP lockout on
    # repeated failures (see "Editing the email text" in the README),
    # but if the people who edit templates always come from a known
    # network, this keeps everyone else from reaching the login form at
    # all. Uncomment and set your own addresses.
    #
    # Behind a proxy (Cloudflare included) this matches the proxy's
    # address, not the visitor's, so it would allow everyone or no one
    # until mod_remoteip is configured -- see the Cloudflare note at the
    # bottom of this file.
    #
    # <Location "/admin">
    #     Require ip 203.0.113.0/24
    #     Require ip 198.51.100.7
    # </Location>

    # Optional: harden the PHP session cookie for the visitor-facing
    # pages too. The admin pages already set these themselves in
    # includes/admin_auth.php; this extends the same treatment to the
    # submission flow. Only takes effect with mod_php (the setup script's
    # default); harmless if you run PHP-FPM instead, in which case set
    # the same three values in your php.ini.
    <IfModule mod_php.c>
        php_value session.cookie_secure   1
        php_value session.cookie_httponly 1
        php_value session.cookie_samesite Lax
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/outreach-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/outreach-ssl-access.log combined
</VirtualHost>
</IfModule>

# OCSP stapling has to be configured at server level, not per vhost --
# SSLStaplingCache is a global directive. If you want it:
#
#   echo 'SSLUseStapling On
#   SSLStaplingCache "shmcb:/var/run/ocsp(128000)"' \
#     | sudo tee /etc/apache2/conf-available/ssl-stapling.conf
#   sudo a2enconf ssl-stapling && sudo systemctl reload apache2

# ---------------------------------------------------------------------
# Behind Cloudflare (or any other proxy)
#
# REMOTE_ADDR becomes a Cloudflare edge address rather than the
# visitor's, and this app keys two things on it: the per-IP submission
# throttle (MAX_SUBMISSIONS_PER_HOUR_PER_IP, which would become a
# site-wide cap shared by every visitor) and the admin login lockout
# (which would lock all admins out together). Restore the real address
# once, at the server level, so both the app and the logs see it:
#
#   sudo scripts/cloudflare-remoteip.sh   # fetches the current ranges
#   sudo a2enmod remoteip
#   sudo a2enconf cloudflare-remoteip
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# It's a server-level config rather than a block in this file so both
# vhosts above pick it up from one place, and so the range list can be
# regenerated on a schedule without touching your vhost.
#
# After enabling it, switch the CustomLog lines above from 'combined' to
# 'combined_cf' to log the real client address.
#
# Two things that matter more than the config itself:
#   - Firewall 80/443 to Cloudflare's ranges (or use a cloudflared
#     tunnel). Trusting CF-Connecting-IP while the origin is directly
#     reachable lets anyone who finds the origin IP spoof a new identity
#     per request, defeating both throttles.
#   - Use Full (Strict) TLS mode, not Flexible. Flexible sends the
#     Cloudflare-to-origin leg in cleartext, admin password included.
#     The certificate configured above satisfies Full (Strict).
# ---------------------------------------------------------------------
